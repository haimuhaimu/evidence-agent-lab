name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not submit private data, credentials, real records, or identifying screenshots. Reproduce the problem with the repository's synthetic fixtures.
  - type: input
    id: case-id
    attributes:
      label: Synthetic case ID
      description: Name the existing or proposed fixed case that reproduces the problem.
      placeholder: steady_7d
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction commands
      description: List the exact local commands and inputs needed to reproduce the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: Describe the decision, evidence, trace, or error you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe the expected contract and why it is supported by the synthetic case.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Provide the operating system and Node.js version; do not include usernames or local paths.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I used synthetic data only and removed credentials, personal data, and local paths.
          required: true
